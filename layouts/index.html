<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; }
    header { border-bottom: 2px solid #2563eb; padding-bottom: 10px; margin-bottom: 30px; }
    header h1 { margin: 0; font-size: 1.8em; color: #2563eb; }
    nav a { margin-right: 15px; color: #2563eb; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    h1, h2 { color: #1e293b; }
    h1 { font-size: 2em; text-align: center; margin-bottom: 10px; }
    h2 { font-size: 1.3em; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
    .subtitle { text-align: center; color: #64748b; font-size: 1.1em; margin-bottom: 30px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid #2563eb; padding: 15px; border-radius: 4px; }
    .card a { color: #1e293b; text-decoration: none; font-weight: 600; font-size: 1.05em; display: block; }
    .card a:hover { color: #2563eb; text-decoration: underline; }
    .intro { background: #f0f9ff; border: 1px solid #bae6fd; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
    .intro p { margin: 0; color: #0c4a6e; }
    footer { border-top: 1px solid #e2e8f0; margin-top: 30px; padding-top: 15px; color: #64748b; font-size: 0.9em; text-align: center; }
    a { color: #2563eb; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{{ .Site.BaseURL }}">首頁</a>
      <a href="{{ "categories/" | relURL }}">章節</a>
    </nav>
  </header>

  <main>
    <h1>Toronto Notes 2025</h1>
    <p class="subtitle">繁體中文翻譯版</p>

    <div class="intro">
      <p>📚 Toronto Notes 2025 繁體中文翻譯，共收錄 {{ len (where .Site.RegularPages "Type" "chapters") }} 個章節。請由下方選擇欲閱讀的章節。</p>
    </div>

    <h2>📖 所有章節</h2>
    <div class="card-grid">
      {{ range where .Site.RegularPages "Type" "chapters" }}
      <div class="card">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </div>
      {{ end }}
    </div>
  </main>

  <footer>
    <p>Powered by Hugo | Toronto Notes 2025 繁體中文翻譯</p>
  </footer>
</body>
</html>
