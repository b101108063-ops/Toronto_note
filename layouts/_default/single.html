<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} - {{ .Site.Title }}</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent: #2563eb;
      --border: #e2e8f0;
      --code-bg: #f1f5f9;
      --link: #2563eb;
      --link-visited: #5500bb;
    }
    [data-theme="dark"] {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16162a;
      --text-primary: #e4e4e7;
      --text-secondary: #a1a1aa;
      --accent: #93c5fd;
      --border: #3f3f46;
      --code-bg: #27272a;
      --link: #93c5fd;
      --link-visited: #c4b5fd;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: var(--text-primary); background: var(--bg-primary); max-width: 900px; margin: 0 auto; padding: 20px; }
    header { border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.5em; color: var(--accent); }
    nav a { margin-right: 15px; color: var(--link); text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    h1, h2, h3 { color: var(--text-primary); }
    h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    h3 { font-size: 1.15em; }
    pre { background: var(--code-bg); padding: 15px; border-radius: 6px; overflow-x: auto; }
    code { background: var(--code-bg); padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 4px solid var(--accent); margin: 0; padding: 5px 15px; color: var(--text-secondary); background: var(--bg-secondary); }
    table { border-collapse: collapse; width: 100%; margin: 15px 0; }
    th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    th { background: var(--bg-secondary); font-weight: 600; }
    tr:nth-child(even) { background: var(--bg-secondary); }
    .content-body { line-height: 1.8; }
    footer { border-top: 1px solid var(--border); margin-top: 30px; padding-top: 15px; color: var(--text-secondary); font-size: 0.9em; }
    .breadcrumb { font-size: 0.9em; color: var(--text-secondary); margin-bottom: 15px; }
    .breadcrumb a { color: var(--link); text-decoration: none; }
    a { color: var(--link); }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }
    .theme-toggle { background: none; border: 1px solid var(--border); color: var(--text-primary); cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 0.85em; }
    .theme-toggle:hover { background: var(--bg-secondary); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{{ .Site.BaseURL }}">首頁</a>
      <a href="{{ "categories/" | relURL }}">章節</a>
    </nav>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 暗色</button>
  </header>

  <main>
    <div class="breadcrumb">
      <a href="{{ .Site.BaseURL }}">首頁</a> &gt; {{ range .Ancestors }}<a href="{{ .RelPermalink }}">{{ .Title }}</a> &gt; {{ end }}{{ .Title }}
    </div>
    <article>
      <h1>{{ .Title }}</h1>
      <div class="content-body">
        {{ .Content }}
      </div>
    </article>
  </main>

  <footer>
    <p>Powered by Hugo | Toronto Notes 2025 繁體中文翻譯</p>
  </footer>
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
    const saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</body>
</html>
