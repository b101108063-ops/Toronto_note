<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} - {{ .Site.Title }}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; }
    header { border-bottom: 2px solid #2563eb; padding-bottom: 10px; margin-bottom: 20px; }
    header h1 { margin: 0; font-size: 1.5em; color: #2563eb; }
    nav a { margin-right: 15px; color: #2563eb; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    h1, h2, h3 { color: #1e293b; }
    h1 { font-size: 1.8em; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
    h2 { font-size: 1.4em; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
    h3 { font-size: 1.15em; }
    pre { background: #f1f5f9; padding: 15px; border-radius: 6px; overflow-x: auto; }
    code { background: #f1f5f9; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
    pre code { background: none; padding: 0; }
    blockquote { border-left: 4px solid #2563eb; margin: 0; padding: 5px 15px; color: #64748b; background: #f8fafc; }
    table { border-collapse: collapse; width: 100%; margin: 15px 0; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
    th { background: #f1f5f9; font-weight: 600; }
    tr:nth-child(even) { background: #f8fafc; }
    .content-body { line-height: 1.8; }
    footer { border-top: 1px solid #e2e8f0; margin-top: 30px; padding-top: 15px; color: #64748b; font-size: 0.9em; }
    .breadcrumb { font-size: 0.9em; color: #64748b; margin-bottom: 15px; }
    .breadcrumb a { color: #2563eb; text-decoration: none; }
    a { color: #2563eb; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{{ .Site.BaseURL }}">首頁</a>
      <a href="{{ "categories/" | relURL }}">章節</a>
    </nav>
  </header>

  <main>
    <div class="breadcrumb">
      <a href="{{ .Site.BaseURL }}">首頁</a> &gt; {{ range .Ancestors }}<a href="{{ .RelPermalink }}">{{ .Title }}</a> &gt; {{ end }}{{ .Title }}
    </div>
    <article>
      <h1>{{ .Title }}</h1>
      <div class="content-body">
        {{ .Content }}
      </div>
    </article>
  </main>

  <footer>
    <p>Powered by Hugo | Toronto Notes 2025 繁體中文翻譯</p>
  </footer>
</body>
</html>
